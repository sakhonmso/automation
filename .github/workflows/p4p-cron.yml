name: P4P Gmail Processor

on:
  schedule:
    - cron: "0 * * * *"   # every 1 hour
  workflow_dispatch:          # also allow manual trigger from GitHub UI

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # kill if stuck (safety net)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci               # ci is faster and stricter than npm install

      - name: Run P4P processor
        env:
          GOOGLE_CLIENT_ID      : ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET  : ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN  : ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY     : ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL          : ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY          : ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN    : ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID      : ${{ secrets.TELEGRAM_CHAT_ID }}
          P4P_FOLDER_ID         : ${{ secrets.P4P_FOLDER_ID }}
        # Retry once on transient network/API failures; cap at 25 min to stay under job timeout
        run: |
          for attempt in 1 2; do
            echo "▶ Attempt $attempt"
            node index.js && break
            if [ $attempt -lt 2 ]; then
              echo "⚠️ Attempt $attempt failed — retrying in 30s…"
              sleep 30
            else
              echo "❌ All attempts failed."
              exit 1
            fi
          done

      - name: Upload JSON results
        if: always()             # upload even if the run had errors
        uses: actions/upload-artifact@v4
        with:
          name: json-results-${{ github.run_number }}
          path: JSON/
          retention-days: 30
          if-no-files-found: ignore